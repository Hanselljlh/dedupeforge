[workspace]
members = [
    "crates/dedupe-core",
    "crates/dedupe-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
repository = "https://github.com/OWNER/dedupeforge"
description = "Safe duplicate-file investigation tool with fast hashing and protected folders"

[workspace.dependencies]
anyhow = "1"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
hex = "0.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
