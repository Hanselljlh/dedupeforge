[workspace]
members = [
    "crates/dedupe-core",
    "crates/dedupe-cli",
    "crates/dedupe-cache",
    "crates/dedupe-actions",
    "crates/dedupe-gui",
    "crates/dedupe-media",
    "crates/dedupe-report-db",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
repository = "https://github.com/Hanselljlh/dedupeforge"
description = "Safe duplicate-file investigation tool with fast hashing and protected folders"

[workspace.dependencies]
anyhow = "1"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
eframe = "0.29"
exif = { package = "kamadak-exif", version = "0.6" }
hex = "0.4"
image = { version = "0.25", default-features = true }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
zip = "2.2"
